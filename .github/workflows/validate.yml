name: Validate Price Scout

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JavaScript syntax
        run: node --check app.js

      - name: Verify required files
        run: |
          test -f index.html
          test -f style.css
          test -f product-config.js
          test -f vercel.json
          test -f supabase/functions/price-scout-telegram/index.ts
